version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_HOST=backend
      - NEXT_PUBLIC_BACKEND_PORT=8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "${PORT_BACKEND:-8000}:8000"
    environment:
      - RADAR_DATABASE_URL=postgresql://radar:radar@db:5432/radar
      - RADAR_REDIS_URL=redis://redis:6379/0
      - RADAR_UPLOAD_DIR=/data/uploads
      - RADAR_RESULTS_DIR=/data/results
    volumes:
      - ./backend:/app
      - radar-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - RADAR_DATABASE_URL=postgresql://radar:radar@db:5432/radar
      - RADAR_REDIS_URL=redis://redis:6379/0
      - RADAR_UPLOAD_DIR=/data/uploads
      - RADAR_RESULTS_DIR=/data/results
    volumes:
      - ./backend:/app
      - radar-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=radar
      - POSTGRES_PASSWORD=radar
      - POSTGRES_DB=radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PORT_PG:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${PORT_REDIS:-6379}:6379"

volumes:
  pgdata:
  radar-data:
