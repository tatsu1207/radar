services:
  frontend:
    image: ghcr.io/tatsu1207/radar-frontend:latest
    build:
      context: ./frontend
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_HOST=backend
      - NEXT_PUBLIC_BACKEND_PORT=8000
    depends_on:
      - backend

  backend:
    image: ghcr.io/tatsu1207/radar-backend:latest
    build:
      context: ./backend
    ports:
      - "${PORT_BACKEND:-7000}:8000"
    environment:
      - RADAR_DATABASE_URL=postgresql://radar:radar@db:5432/radar
      - RADAR_REDIS_URL=redis://redis:6379/0
      - RADAR_UPLOAD_DIR=/data/uploads
      - RADAR_RESULTS_DIR=/data/results
      - RADAR_ML_MODELS_DIR=/data/ml_models
    volumes:
      - radar-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ghcr.io/tatsu1207/radar-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A app.celery_app worker --loglevel=info -Q pipeline,celery --concurrency=4
    environment:
      - RADAR_DATABASE_URL=postgresql://radar:radar@db:5432/radar
      - RADAR_REDIS_URL=redis://redis:6379/0
      - RADAR_UPLOAD_DIR=/data/uploads
      - RADAR_RESULTS_DIR=/data/results
      - RADAR_ML_MODELS_DIR=/data/ml_models
    volumes:
      - radar-data:/data
      - radar-databases:/databases
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=radar
      - POSTGRES_PASSWORD=radar
      - POSTGRES_DB=radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PORT_PG:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${PORT_REDIS:-6379}:6379"

volumes:
  pgdata:
  radar-data:
  radar-databases:
